name: collect-gpu-prices

on:
  schedule:
    - cron: "0 * * * *" # mỗi giờ (GitHub có thể trễ 5-15 phút, không sao với data này)
  workflow_dispatch: # cho phép chạy tay từ tab Actions

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect prices
        run: python3 collect_prices.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push

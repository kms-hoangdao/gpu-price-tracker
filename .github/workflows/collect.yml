name: collect-gpu-prices

on:
  schedule:
    - cron: "0 * * * *" # mỗi giờ (GitHub có thể trễ 5-15 phút, không sao với data này)
  workflow_dispatch: # cho phép chạy tay từ tab Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect prices
        run: python3 collect_prices.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" || {
            git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          }

      - name: Generate report
        run: |
          python3 analyze.py
          mkdir -p _site
          cp report.html _site/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
